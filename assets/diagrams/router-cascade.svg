<svg viewBox="0 0 910 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una richiesta attraversa un solo percorso, dal router CLAUDE.md a un indice a un file: il resto del vault non viene letto.">
  <title>Router → indice → file: un solo percorso letto per richiesta</title>
  <defs>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#d97706" />
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#64748b" fill-opacity="0.45" />
    </marker>
  </defs>

  <!-- Router -->
  <rect x="340" y="24" width="220" height="56" rx="6" fill="none" stroke="#64748b" stroke-width="1.6" />
  <text x="450" y="47" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#64748b">CLAUDE.md</text>
  <text x="450" y="63" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b">router</text>

  <!-- Router -> indices -->
  <line x1="450" y1="80" x2="150" y2="158" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />
  <line x1="450" y1="80" x2="450" y2="158" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAccent)" />
  <line x1="450" y1="80" x2="750" y2="158" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />

  <!-- Indices -->
  <rect x="60" y="160" width="180" height="52" rx="6" fill="none" stroke="#64748b" stroke-width="1.3" stroke-opacity="0.55" />
  <text x="150" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#64748b" opacity="0.7">wiki_index.md</text>

  <rect x="360" y="160" width="180" height="52" rx="6" fill="none" stroke="#d97706" stroke-width="1.8" />
  <text x="450" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#d97706">skills_index.md</text>

  <rect x="660" y="160" width="180" height="52" rx="6" fill="none" stroke="#64748b" stroke-width="1.3" stroke-opacity="0.55" />
  <text x="750" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#64748b" opacity="0.7">projects_index.md</text>

  <!-- Indices -> files -->
  <line x1="150" y1="212" x2="75" y2="298" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />
  <line x1="150" y1="212" x2="225" y2="298" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />

  <line x1="450" y1="212" x2="375" y2="298" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />
  <line x1="450" y1="212" x2="525" y2="298" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowAccent)" />

  <line x1="750" y1="212" x2="675" y2="298" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />
  <line x1="750" y1="212" x2="825" y2="298" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" marker-end="url(#arrowDim)" />

  <!-- Files -->
  <rect x="10" y="300" width="130" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="1.1" stroke-opacity="0.4" />
  <text x="75" y="329" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.6">nota-1.md</text>

  <rect x="160" y="300" width="130" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="1.1" stroke-opacity="0.4" />
  <text x="225" y="329" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.6">nota-2.md</text>

  <rect x="310" y="300" width="130" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="1.1" stroke-opacity="0.4" />
  <text x="375" y="329" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.6">onboarding/</text>

  <rect x="460" y="300" width="130" height="48" rx="6" fill="none" stroke="#d97706" stroke-width="2" />
  <text x="525" y="329" text-anchor="middle" font-size="11.5" font-family="sans-serif" fill="#d97706" font-weight="600">bibliotecario/</text>

  <rect x="610" y="300" width="130" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="1.1" stroke-opacity="0.4" />
  <text x="675" y="329" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.6">progetto-1/</text>

  <rect x="760" y="300" width="130" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="1.1" stroke-opacity="0.4" />
  <text x="825" y="329" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.6">progetto-2/</text>

  <!-- Legend -->
  <line x1="20" y1="374" x2="58" y2="374" stroke="#d97706" stroke-width="2" />
  <text x="66" y="378" font-size="11" font-family="sans-serif" fill="#64748b">percorso letto per questa richiesta</text>

  <line x1="20" y1="394" x2="58" y2="394" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.4" />
  <text x="66" y="398" font-size="11" font-family="sans-serif" fill="#64748b" opacity="0.75">resto del vault — centinaia di file — mai letto</text>
</svg>
